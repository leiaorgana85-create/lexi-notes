<!doctype html>
<html lang="en" data-app-version="v1.01">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lexi Notes">
  <title>Lexi Notes</title>
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <link rel="apple-touch-icon" href="https://leiaorgana85-create.github.io/lexi-assets/notes-logo.png?v=1">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="ui-fixes.css?v=3">
</head>
<body>
  <div class="app-shell">
    <header id="topbar" class="topbar">
      <div class="brand-row">
        <h1 class="brand-title"><svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 8h7M8.5 12h7M8.5 16h5"/></svg><span>Lexi Notes</span></h1>
        <small id="appVersion" data-version="v1.01" style="display:block;font-size:10px;line-height:1.5;font-weight:400;color:var(--muted,#888);text-align:right;margin:0 0 0 auto;white-space:nowrap">v1.01</small>
        <button id="refreshBtn" class="icon-btn ghost" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
      <label class="search-wrap" aria-label="Search all notes">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="searchInput" type="search" placeholder="Search all notes" autocomplete="off" spellcheck="false"><button id="clearSearchBtn" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
      </label><div id="syncStatus" class="status" aria-live="polite"></div>
    </header>
    <main>
      <section id="connectView" class="card connect-card" hidden><h2>Connect Lexi Notes</h2><p>Enter the private API key for the Lexi Notes backend. It stays on this device.</p><input id="apiKeyInput" type="password" autocomplete="off" placeholder="API key"><button id="connectBtn" class="primary-btn" type="button">Connect</button><div id="connectError" class="error-text" aria-live="polite"></div></section>
      <section id="listView"><div id="emptyState" class="empty-state" hidden>No notes yet.</div><div id="notesList" class="notes-list"></div></section>
      <section id="noteView" class="note-view" hidden>
        <div class="note-toolbar"><button id="backBtn" class="back-btn" type="button" aria-label="Back to notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>Notes</span></button><div class="note-actions"><button id="editBtn" class="icon-btn ghost" type="button" aria-label="Edit note" title="Edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg></button><button id="emailBtn" class="icon-btn ghost" type="button" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></button><button id="shareBtn" class="icon-btn ghost" type="button" aria-label="Share" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m8 8 4-4 4 4"/><path d="M5 12v7h14v-7"/></svg></button><button id="deleteBtn" class="icon-btn ghost danger" type="button" aria-label="Delete" title="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="m9 7 .7-2h4.6l.7 2"/><path d="m6.5 7 .8 13h9.4l.8-13"/><path d="M10 11v5M14 11v5"/></svg></button><button id="saveBtn" class="primary-btn compact toolbar-save" type="button" hidden>Save</button></div></div>
        <div id="lockedGate" class="locked-gate" hidden><svg class="locked-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><div class="locked-title">Locked note</div><button id="unlockBtn" class="primary-btn compact" type="button">Unlock</button></div>
        <div id="noteContent"><div id="readMode"><h2 id="readTitle" class="read-title"></h2><div id="readBody" class="read-body" title="Tap to edit"></div></div><div id="editMode" hidden><input id="titleInput" class="title-input" type="text" autocomplete="off"><div id="formatBar" class="format-bar" aria-label="Note formatting"><button type="button" data-tool="bullet" aria-label="Bullet list" title="Bullet list"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/><path d="M9 7h10M9 12h10M9 17h10"/></svg></button><button type="button" data-tool="number" aria-label="Numbered list" title="Numbered list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h2v3M4 9h3"/><path d="M4 13c.4-1.1 3-1.3 3 .3 0 1-3 2-3 3.7h3"/><path d="M10 7h10M10 12h10M10 17h10"/></svg></button><button type="button" data-tool="check" aria-label="Checklist" title="Checklist"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1"/><path d="m4.5 7 1.5 1.5L9 5.5"/><rect x="3" y="14" width="6" height="6" rx="1"/><path d="M12 7h9M12 17h9"/></svg></button><button type="button" data-tool="outdent" aria-label="Outdent" title="Outdent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6h10M11 12h10M11 18h10"/><path d="m8 9-3 3 3 3"/></svg></button><button type="button" data-tool="indent" aria-label="Indent" title="Indent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6h10M11 12h10M11 18h10"/><path d="m5 9 3 3-3 3"/></svg></button><button type="button" data-tool="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8H4v-5"/><path d="M4 8c3-4 10-5 14-1 3 3 3 8 0 11"/></svg></button><button type="button" data-tool="redo" aria-label="Redo" title="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8h5v-5"/><path d="M20 8c-3-4-10-5-14-1-3 3-3 8 0 11"/></svg></button><button type="button" data-tool="date" aria-label="Insert date" title="Insert date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="M8 14h3M8 17h3M14 14h2"/></svg></button></div><textarea id="bodyInput" class="body-input" placeholder="Write a note…" spellcheck="true"></textarea><div class="edit-footer"><span id="saveStatus" class="status" aria-live="polite"></span></div></div></div>
      </section>
    </main>
    <button id="newNoteBtn" class="fab" type="button" aria-label="New note" title="New note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="pinDialog" class="pin-dialog"><form method="dialog" id="pinForm"><h2 id="pinDialogTitle">Unlock note</h2><p id="pinDialogText">Enter your Lexi Notes PIN.</p><input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="12"><input id="pinConfirmInput" type="password" autocomplete="off" placeholder="Confirm PIN" maxlength="12" hidden><div id="pinError" class="error-text" aria-live="polite"></div><div class="dialog-actions"><button id="pinCancelBtn" class="secondary-btn" type="button">Cancel</button><button id="pinSubmitBtn" class="primary-btn compact" type="submit">Unlock</button></div></form></dialog>
  <script src="backend-auth-recovery.js?v=1" data-backend-url="https://script.google.com/macros/s/AKfycbwsZrm-TgtziRbM7AkJ538pmozw4CNsZA_tGApk6Osz-Sa9IXqvAl_SRbeMvdC-LUWK/exec" data-insert-after="syncStatus" data-retry-button="refreshBtn" data-app-label="Lexi Notes"></script>
  <script src="write-transport.js?v=2"></script>
  <script src="sync-guard.js?v=4"></script>
  <script src="app.js?v=12"></script>
  <script src="list-position.js?v=2"></script>
  <script src="ui-fixes.js?v=2"></script>
  <script src="gestures.js?v=3"></script>
</body>
</html>
